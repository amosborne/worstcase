[project]
name = "worstcase"
version = "1.0.0"
description = "Unit-aware scalar expressions for corner, Monte Carlo, and RSS analysis."
authors = [{name = "Alex Osborne", email = "alex@osborneee.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11,<4"
dependencies = ["numpy>=2.2,<3", "executing>=2.1,<3"]

[project.urls]
Repository = "https://github.com/amosborne/worstcase"

[tool.poetry.group.dev.dependencies]
pre-commit = ">=4.6,<5"
isort = ">=8,<10"
black = ">=26.10,<27"
flake8 = ">=7.3,<8"
flake8-pyproject = ">=1.2.4,<2"
pytest = ">=9,<10"
pytest-randomly = ">=4,<6"
pytest-cov = ">=7,<8"
pip-audit = ">=2.9,<3"
Pint = ">=0.25,<0.27"
forallpeople = ">=3,<4"
unyt = ">=3.1,<4"
quantities = ">=0.16.4,<0.17"
astropy = ">=7.2,<8"
handcalcs = ">=1.9,<2"

[tool.poetry.group.examples]
optional = true

[tool.poetry.group.examples.dependencies]
nbclient = ">=0.10,<0.12"
nbformat = ">=5.10,<6"
ipykernel = ">=7.2,<8"
scipy = ">=1.15,<2"
Pint = ">=0.25,<0.27"

[tool.isort]
profile = "black"

[tool.flake8]
max-line-length = 88
extend-ignore = "E203,W503"
extend-exclude = ".venv,dist,build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[build-system]
requires = ["poetry-core>=2.2,<3"]
build-backend = "poetry.core.masonry.api"
