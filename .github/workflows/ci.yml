name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install poetry==2.5.1
      - run: poetry sync --with examples
      - run: poetry run python -m pytest --cov=worstcase --cov-report=term-missing
      - run: poetry run python scripts/check_notebook.py
  quality-and-packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install poetry==2.5.1
      - run: poetry sync --with examples
      - run: poetry check --lock
      - run: poetry run black --check worstcase tests examples scripts
      - run: poetry run isort --check-only worstcase tests examples scripts
      - run: poetry run flake8 worstcase tests examples scripts
      - run: poetry run pip-audit --skip-editable --strict --progress-spinner off
      - run: poetry build
      - run: poetry run python scripts/check_artifacts.py
