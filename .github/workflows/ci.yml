name: CI
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install poetry==2.5.1
      - run: poetry sync --with examples
      - run: poetry run python -m pytest --cov=worstcase --cov-report=term-missing
      - run: poetry run python scripts/check_notebook.py
  quality-and-packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: python -m pip install poetry==2.5.1
      - run: poetry sync --with examples
      - run: poetry check --lock
      - run: poetry run black --check worstcase tests scripts
      - run: poetry run isort --check-only worstcase tests scripts
      - run: poetry run flake8 worstcase tests scripts
      - run: poetry run python scripts/audit_dependencies.py
      - run: poetry build
      - run: poetry run python scripts/check_artifacts.py
